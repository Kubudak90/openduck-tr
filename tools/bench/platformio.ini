; OpenDuck-TR Adim 0 tezgah betigi: ESP32-S3-DevKitC-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
;   pio run -d tools/bench                  # derle
;   pio run -d tools/bench -t upload        # yukle (kartin "UART"/"COM" USB portu)
;   pio device monitor -d tools/bench       # 921600 baud
; Arduino IDE icin ayarlar: bench/bench.ino basligi.
[platformio]
src_dir = bench
default_envs = bench

[env:bench]
platform = platformio/espressif32 @ 8.0.0     ; Arduino-ESP32 core 3.3.x (derlenip denendi)
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 921600
upload_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBENCH_BAUD=921600

; Yerel USB portu (USB-OTG, CDC): 1 kHz kayit icin daha hizli. Yukleme ayni porttan.
[env:bench_usb]
extends = env:bench
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBENCH_BAUD=921600
